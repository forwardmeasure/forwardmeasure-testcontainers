# CHANGED 2026-09-20: was the bare official quay.io/keycloak/keycloak image. Every real caller of
# this fixture that provisions an Organization-scoped role permission (AuthzenKeycloakFixture, and
# transitively every test converted off StubAuthorizationService onto a real Keycloak) needs the
# "organization-role" Policy Provider from helm-charts/charts/keycloak-helm-chart/policy-provider -
# built on top of quay.io/keycloak/keycloak:${keycloak.version} - see that chart's own Dockerfile.
# The bare official image has no policy type that can correctly express "role granted via
# Organization group membership" at all (confirmed by extensive live testing - every built-in
# policy type either ignores Organization data entirely or the Admin API refuses to reference
# Organization groups from it), so real tests need this image, not the plain upstream one.
# NOT YET PUSHED to a real registry - built locally only so far (`docker build` in that chart's own
# directory). Whoever runs these tests on a machine without that local image cached needs to build
# and push it first - flagged here rather than silently assumed available.
image=docker.io/forwardmeasure/keycloak:${keycloak.version}-authz
